# Weekly updates for the Worker's and the app's npm packages and for the workflow's actions (pinned by commit, so
# Dependabot is what moves them on). Minor and patch updates come grouped, one PR per folder.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: npm
    directory: /app
    schedule: { interval: weekly }
    groups:
      minor-and-patch: { update-types: [minor, patch] }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
