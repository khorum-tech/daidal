name: cla

# Asks each new contributor to sign the Contributor License Agreement (CLA.md) on their first pull request, and
# keeps the check red until everyone who committed to it has signed.
#
# Signing is a comment on the pull request with the exact sentence in `custom-pr-sign-comment` below. The action
# records it in signatures/cla.json on the `cla-signatures` branch, which must exist and must not be protected:
# the workflow's own token commits there. main stays protected and is never written to.
#
# This uses pull_request_target, which deploy.yml rules out for itself. It is safe here because nothing checks
# out or runs the pull request's code: the action only reads who committed and posts comments and a status.
on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  contents: read

jobs:
  cla:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the Daidal CLA and I agree to its terms'))
    permissions:
      # To commit signatures to the cla-signatures branch.
      contents: write
      # To comment on and lock the pull request.
      pull-requests: write
      # To set the CLA status on the pull request's head commit.
      statuses: write
      # To re-run the check on the pull request after someone signs in a comment.
      actions: write
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/khorum-tech/daidal/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          # The licensor's own account and bots don't sign. Nor do commits Claude Code makes for the licensor in a
          # cloud session, which carry the author "Claude" (GitHub shows them as the `claude` account): both
          # spellings are listed because the match is exact and case-sensitive.
          allowlist: violabs-josh,dependabot[bot],github-actions[bot],claude,Claude
          custom-pr-sign-comment: I have read the Daidal CLA and I agree to its terms
          custom-notsigned-prcomment: >-
            Thanks for the pull request. Before it can merge, everyone who committed to it needs to sign the
            [Daidal Contributor License Agreement](https://github.com/khorum-tech/daidal/blob/main/CLA.md) once, by
            commenting with the sentence below. It takes a minute, and it covers every later pull request too.
          custom-allsigned-prcomment: Everyone who committed to this pull request has signed the Daidal CLA.
          signed-commit-message: "$contributorName signed the CLA in $owner/$repo#$pullRequestNo"
          create-file-commit-message: Start the CLA signature record
