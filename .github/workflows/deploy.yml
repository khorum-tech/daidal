name: deploy

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --ignore-scripts --prefix app
      - run: npm run build
      - run: npm run typecheck
      # One Chromium serves the app's component tests and the end-to-end tests (both on Playwright 1.63). Through
      # npm, so it is the locked Playwright that installs it, never one npx fetches.
      - run: npm run playwright:install
      - run: npm test
      - run: npm run e2e
      - run: npm run build-storybook --prefix app
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --ignore-scripts --prefix app
      - run: npx wrangler d1 migrations apply skope --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Stage: every push to a PR from this repository re-deploys https://skope-stage.khorum-oss.org and resets its
  # data to invented stage data (stage/diagrams.ts). One shared stage, so the last push wins. Fork PRs never get it:
  # GitHub gives them no secrets, and this job never runs their code with the Cloudflare token
  # (never switch to pull_request_target). One-time setup: docs/stage.md.
  stage:
    needs: test
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: stage
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      # STAGE_OWNER_EMAIL is a secret so it stays masked in this public repository's logs; it is passed only to
      # the step that needs it. Readiness is computed from expressions, so no value is ever echoed.
      - id: setup
        name: Check stage is set up
        run: |
          echo "ready=${{ vars.STAGE_D1_ID != '' && vars.STAGE_ACCESS_AUD != '' && secrets.STAGE_OWNER_EMAIL != '' }}" >> "$GITHUB_OUTPUT"
      - if: steps.setup.outputs.ready != 'true'
        name: Stage not set up yet
        run: echo "::notice title=Stage not set up yet::Set the STAGE_D1_ID and STAGE_ACCESS_AUD variables and the STAGE_OWNER_EMAIL secret to deploy PRs to stage (docs/stage.md)."
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/checkout@v4
      - if: steps.setup.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.setup.outputs.ready == 'true'
        run: npm ci
      - if: steps.setup.outputs.ready == 'true'
        run: npm ci --ignore-scripts --prefix app
      - if: steps.setup.outputs.ready == 'true'
        name: Generate wrangler.stage.jsonc
        run: node scripts/stage-config.mjs
        env:
          STAGE_D1_ID: ${{ vars.STAGE_D1_ID }}
          STAGE_ACCESS_AUD: ${{ vars.STAGE_ACCESS_AUD }}
      - if: steps.setup.outputs.ready == 'true'
        name: Apply migrations to the stage database
        run: npx wrangler d1 migrations apply skope-stage --remote -c wrangler.stage.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.setup.outputs.ready == 'true'
        name: Generate seed.sql
        run: npm run stage-seed
        env:
          STAGE_OWNER_EMAIL: ${{ secrets.STAGE_OWNER_EMAIL }}
      - if: steps.setup.outputs.ready == 'true'
        name: Reset the stage database to the stage data
        run: npx wrangler d1 execute skope-stage --remote --file seed.sql -c wrangler.stage.jsonc --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.setup.outputs.ready == 'true'
        name: Deploy the stage Worker
        run: npx wrangler deploy -c wrangler.stage.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.setup.outputs.ready == 'true'
        name: Link stage on the PR
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.head_ref }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          marker='<!-- skope-stage -->'
          body="$marker
          **Stage:** \`$BRANCH\` at \`${SHA:0:7}\` is live at https://skope-stage.khorum-oss.org (the app, with the stage data: https://skope-stage.khorum-oss.org/app/)

          Stage data is invented and **resets on every push** to any PR, so nothing entered there is kept. Stage is shared: it shows whichever PR pushed last."
          id="$(gh api --paginate "repos/$REPO/issues/$PR/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -f body="$body" > /dev/null
          fi
