name: deploy

on:
  push:
    branches: [main]
  pull_request:
    # Not closed: a merge or close never deploys anything to stage. Stage shows the last PR pushed until another is.
    types: [opened, synchronize, reopened, ready_for_review]
  # Put a branch on stage by hand: Actions → deploy → Run workflow, from main. Only code owners (.github/CODEOWNERS)
  # get past the stage job's check. See the stage job and docs/stage.md.
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to put on stage (a branch of this repository)"
        type: string
        required: false
      hold:
        description: "Hold stage on this branch for up to 12 hours: no PR push moves it until then, its merge, or a release"
        type: boolean
        default: false
      reset_data:
        description: "Reset stage's data to the stage data (untick to keep stage's data; migrations still run)"
        type: boolean
        default: true
      release:
        description: "Release the hold instead: the open PR pushed most recently deploys (branch is ignored)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    # A release by hand has nothing to test.
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.release) }}
    runs-on: ubuntu-latest
    outputs:
      # By hand, stage deploys exactly the commit tested here, even if the branch moves on meanwhile.
      sha: ${{ steps.sha.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # By hand, the branch named; otherwise the event's own commit.
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.branch || '' }}
          persist-credentials: false
      - id: sha
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm ci --ignore-scripts --prefix app
      # Everything that draws a diagram is in packages/core, and the Claude skill and other integrations load it from
      # npm. A pull request that changes what core ships must move core's version past npm's, so the next publish-core
      # run carries the change (scripts/core-version-lib.mjs). The base branch is fetched by name, never by an
      # event value in the script's text.
      - name: Core changes carry a new core version
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 --no-tags origin "refs/heads/$BASE_REF"
          node scripts/core-version-check.mjs
      - run: npm run build
      - run: npm run typecheck
      # One Chromium serves the app's component tests and the end-to-end tests (both pin the same Playwright). Through
      # npm, so it is the locked Playwright that installs it, never one npx fetches.
      - run: npm run playwright:install
      - run: npm test
      - run: npm run e2e
      - run: npm run build-storybook --prefix app
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Prod. Its Cloudflare token lives in the `Prod` environment, which only `main` may use (Settings →
  # Environments), so no pull request's code ever runs with it. Stage has its own token (STAGE_CLOUDFLARE_*).
  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: Prod
    concurrency: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # No install scripts where a Cloudflare token is about: a dependency can't run code before wrangler does
      # (wrangler, workerd and esbuild work without them).
      - run: npm ci --ignore-scripts
      - run: npm ci --ignore-scripts --prefix app
      # wrangler.jsonc holds only placeholders; prod's database id and AUD come from the `Prod` environment,
      # as secrets or variables (either works).
      - name: Generate wrangler.prod.jsonc
        run: node scripts/prod-config.mjs
        env:
          PROD_D1_ID: ${{ secrets.PROD_D1_ID || vars.PROD_D1_ID }}
          PROD_ACCESS_AUD: ${{ secrets.PROD_ACCESS_AUD || vars.PROD_ACCESS_AUD }}
      - run: ./node_modules/.bin/wrangler d1 migrations apply skope --remote -c wrangler.prod.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
      # The Access AUD goes up as a Worker secret, from the file prod-config wrote: wrangler prints every plain
      # variable's value in this log, which is public.
      # wrangler builds the app first; the DAIDAL_* names stamp the build (scripts/build-info.mjs): the release
      # version and this commit, shown in the app's account menu and at /version.
      - run: ./node_modules/.bin/wrangler deploy -c wrangler.prod.jsonc --secrets-file wrangler.prod.secrets.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          DAIDAL_CHANNEL: prod
          DAIDAL_BRANCH: main
          DAIDAL_COMMIT: ${{ github.sha }}

  # Stage: one shared site, on the hostnames in scripts/stage-config.mjs.
  #
  # Every push to a PR from this repository opened by a code owner (.github/CODEOWNERS on main), draft or not,
  # deploys it to stage once its tests pass, and resets stage's data to the invented stage data (stage/diagrams.ts):
  # the last PR pushed is what stage shows. A merge or close deploys nothing. A PR from anyone else never deploys by
  # itself; a code owner can put it there by hand. Whenever a push doesn't deploy, the run says why as a warning,
  # in its summary and on the PR.
  #
  # By hand: Actions → deploy → Run workflow (from main), naming a branch. Tests run on that branch, then it goes on
  # stage. With "hold" ticked, PR pushes leave stage alone until the hold ends: after 12 hours, when the held
  # branch is merged or deleted, when a code owner runs it again with "release", or when another branch is deployed
  # by hand. The hold is kept as a GitHub deployment on the `stage-hold` environment.
  #
  # Fork PRs never get stage: GitHub gives them no secrets, and this job never runs their code with the Cloudflare
  # token (never switch to pull_request_target). One-time setup: docs/stage.md.
  stage:
    needs: test
    # needs.test is skipped on a release (nothing to test), which still runs this job; a failed
    # test stops it. By hand it runs only from main, so the workflow that checks for a code owner is main's.
    if: >-
      always() && needs.test.result != 'failure' && needs.test.result != 'cancelled' && (
        (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository &&
        github.event.pull_request.user.type != 'Bot' && !endsWith(github.event.pull_request.user.login, '[bot]')) ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    # Stage's settings live in the `stage` environment (repository-level ones are read too); it must allow PR branches.
    environment: stage
    # One deploy at a time, in order: a waiting run never cuts a deploy short.
    concurrency:
      group: stage
      cancel-in-progress: false
    permissions:
      contents: read
      pull-requests: write
      # The hold is a deployment on `stage-hold`.
      deployments: write
    steps:
      # STAGE_OWNER_EMAIL is a secret so it stays masked in this public repository's logs; it is passed only to
      # the step that needs it. Readiness is computed from expressions, so no value is ever echoed.
      - id: setup
        name: Check stage is set up
        # Each flag is true or false only; no value reaches the log.
        env:
          HAS_D1_ID: ${{ secrets.STAGE_D1_ID != '' || vars.STAGE_D1_ID != '' }}
          HAS_ACCESS_AUD: ${{ secrets.STAGE_ACCESS_AUD != '' || vars.STAGE_ACCESS_AUD != '' }}
          HAS_OWNER_EMAIL: ${{ secrets.STAGE_OWNER_EMAIL != '' }}
          HAS_CLOUDFLARE_API_TOKEN: ${{ secrets.STAGE_CLOUDFLARE_API_TOKEN != '' }}
          HAS_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGE_CLOUDFLARE_ACCOUNT_ID != '' || vars.STAGE_CLOUDFLARE_ACCOUNT_ID != '' }}
        run: |
          missing=""
          for name in D1_ID ACCESS_AUD OWNER_EMAIL CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            flag="HAS_$name"
            [ "${!flag}" = "true" ] || missing="$missing STAGE_$name"
          done
          if [ -z "$missing" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Stage not set up yet::Missing from the stage environment and repository settings:$missing. STAGE_D1_ID, STAGE_ACCESS_AUD and STAGE_CLOUDFLARE_ACCOUNT_ID may be secrets or variables; the rest are secrets (docs/stage.md)."
          fi
      # What goes on stage, if anything: by hand, the named branch (or, on a release, the open PR pushed most
      # recently); from a PR, the PR itself, unless stage is held or its author isn't a code owner.
      - if: steps.setup.outputs.ready == 'true'
        id: line
        name: Decide what goes on stage
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          PR: ${{ github.event.pull_request.number }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          # Event values go in through the environment, never into the script's text: a branch name is chosen by
          # whoever pushes it.
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          INPUT_BRANCH: ${{ inputs.branch }}
          INPUT_RELEASE: ${{ inputs.release }}
          TESTED_SHA: ${{ needs.test.outputs.sha }}
        run: |
          out() { echo "$1" >> "$GITHUB_OUTPUT"; }
          # Code owners: the users named in main's .github/CODEOWNERS (never the PR's copy, which its author could
          # edit). Teams (@org/team) aren't read: name people. No file means no code owners, so nothing auto-deploys.
          owners="$(gh api "repos/$REPO/contents/.github/CODEOWNERS" -H "Accept: application/vnd.github.raw" 2>/dev/null \
            | sed 's/#.*//' | grep -o '@[A-Za-z0-9_./-]*' | grep -v / | cut -c2- | tr 'A-Z' 'a-z' | sort -u || true)"
          is_owner() { [ -n "$1" ] && printf '%s\n' "$owners" | grep -qxF "$(printf '%s' "$1" | tr 'A-Z' 'a-z')"; }

          # The hold: the latest deployment on `stage-hold`, if its latest status is success. A hold can't get stuck:
          # it ends by itself after 12 hours, or once its branch is merged into main or deleted.
          hold_id=""; hold_branch=""
          latest="$(gh api "repos/$REPO/deployments?environment=stage-hold&per_page=1" --jq '.[0] | "\(.id) \(.created_at) \(.payload.branch // "")"' 2>/dev/null || true)"
          if [ -n "$latest" ] && [ "${latest%% *}" != "null" ]; then
            read -r id held_at branch_held <<< "$latest"
            state="$(gh api "repos/$REPO/deployments/$id/statuses?per_page=1" --jq '.[0].state // ""' || true)"
            if [ "$state" = "success" ]; then
              ended=""
              age=$(( $(date +%s) - $(date -d "$held_at" +%s) ))
              if [ "$age" -gt $((12 * 3600)) ]; then
                ended="it was set over 12 hours ago"
              elif [ -z "$branch_held" ] || ! gh api "repos/$REPO/branches/$branch_held" > /dev/null 2>&1; then
                ended="its branch is gone"
              elif [ "$(gh api "repos/$REPO/compare/main...$branch_held" --jq .ahead_by 2>/dev/null || echo 1)" = "0" ]; then
                ended="its branch is merged into main"
              fi
              if [ -n "$ended" ]; then
                gh api "repos/$REPO/deployments/$id/statuses" -f state=inactive -f description="Ended: $ended" > /dev/null
                echo "::notice title=Stage hold ended::The hold on $branch_held ended because $ended."
              else
                hold_id="$id"; hold_branch="$branch_held"
              fi
            fi
          fi
          out "hold_id=$hold_id"

          # On a release: the open PR from this repository by a code owner, draft or not, pushed most recently.
          # (Bots are never code owners: their runs get no secrets.)
          latest_pr=""
          while read -r n sha ref login; do
            if [ -n "$n" ] && is_owner "$login"; then latest_pr="$n $sha $ref"; break; fi
          done < <(gh api "repos/$REPO/pulls?state=open&sort=updated&direction=desc&per_page=100" \
            --jq ".[] | select(.head.repo.full_name == \"$REPO\") | \"\(.number) \(.head.sha) \(.head.ref) \(.user.login)\"")

          if [ "$EVENT" = "workflow_dispatch" ]; then
            if ! is_owner "$ACTOR"; then
              echo "::error title=Not a code owner::Only the code owners in .github/CODEOWNERS can put a branch on stage by hand."
              exit 1
            fi
            out "manual=true"
            if [ "$INPUT_RELEASE" = "true" ]; then
              # Release: PR pushes deploy again, and the open PR pushed most recently goes on stage now.
              out "release=true"
              if [ -n "$latest_pr" ]; then
                read -r pr sha branch <<< "$latest_pr"
                out "deploy=true"
              else
                out "deploy=false"
                echo "::notice title=Stage released::No open PR to put on stage; the next PR push deploys."
              fi
            else
              [ -n "$INPUT_BRANCH" ] || { echo "::error::Name a branch to deploy (or tick release)."; exit 1; }
              branch="$INPUT_BRANCH"; sha="$TESTED_SHA"
              pr="$(gh api "repos/$REPO/pulls?state=open&head=${REPO%%/*}:$branch" --jq '.[0].number // empty' || true)"
              out "deploy=true"
            fi
          elif [ -n "$hold_id" ]; then
            # Held by hand: no PR moves stage until the hold ends.
            out "deploy=false"
            out "held=$hold_branch"
            echo "::warning title=Stage not deployed::Stage is held by hand on $hold_branch. It ends after 12 hours, when that branch merges, or on a release (Actions → deploy → Run workflow, tick release)."
          elif ! is_owner "$PR_AUTHOR"; then
            out "deploy=false"
            out "not_owner=true"
            echo "::warning title=Stage not deployed::Only PRs opened by a code owner (.github/CODEOWNERS) deploy to stage by themselves."
          else
            pr="$PR"; sha="$HEAD_SHA"; branch="$HEAD_REF"
            out "deploy=true"
          fi
          [ -n "${sha:-}" ] && { out "sha=$sha"; out "branch=$branch"; }
          [ -n "${pr:-}" ] && out "pr=$pr"
          true
      - if: steps.line.outputs.deploy == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.line.outputs.sha }}
          # Pull-request code runs from here on; it gets no saved GitHub token.
          persist-credentials: false
      - if: steps.line.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - if: steps.line.outputs.deploy == 'true'
        run: npm ci --ignore-scripts
      - if: steps.line.outputs.deploy == 'true'
        run: npm ci --ignore-scripts --prefix app
      - if: steps.line.outputs.deploy == 'true'
        name: Generate wrangler.stage.jsonc
        run: node scripts/stage-config.mjs
        env:
          STAGE_D1_ID: ${{ secrets.STAGE_D1_ID || vars.STAGE_D1_ID }}
          STAGE_ACCESS_AUD: ${{ secrets.STAGE_ACCESS_AUD || vars.STAGE_ACCESS_AUD }}
      - if: steps.line.outputs.deploy == 'true'
        name: Apply migrations to the stage database
        run: ./node_modules/.bin/wrangler d1 migrations apply skope-stage --remote -c wrangler.stage.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGE_CLOUDFLARE_ACCOUNT_ID || vars.STAGE_CLOUDFLARE_ACCOUNT_ID }}
      # By hand, "reset data" can be unticked to keep what's in stage's database (migrations still run).
      - if: steps.line.outputs.deploy == 'true' && (github.event_name != 'workflow_dispatch' || inputs.release || inputs.reset_data)
        name: Generate seed.sql
        run: npm run stage-seed
        env:
          STAGE_OWNER_EMAIL: ${{ secrets.STAGE_OWNER_EMAIL }}
      - if: steps.line.outputs.deploy == 'true' && (github.event_name != 'workflow_dispatch' || inputs.release || inputs.reset_data)
        name: Reset the stage database to the stage data
        run: ./node_modules/.bin/wrangler d1 execute skope-stage --remote --file seed.sql -c wrangler.stage.jsonc --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGE_CLOUDFLARE_ACCOUNT_ID || vars.STAGE_CLOUDFLARE_ACCOUNT_ID }}
      - if: steps.line.outputs.deploy == 'true'
        name: Deploy the stage Worker
        # The Access AUD goes up as a Worker secret (see the prod deploy above). The DAIDAL_* names stamp the build
        # as a snapshot of this branch (scripts/build-info.mjs), shown in the header's stage badge and at /version:
        # the checkout here is a bare commit, so git alone can't name the branch.
        id: stage_deploy
        run: |
          ./node_modules/.bin/wrangler deploy -c wrangler.stage.jsonc --secrets-file wrangler.stage.secrets.json
          # The version the app now names in its account menu, from the same stamp the build used.
          version="$(node scripts/build-info.mjs | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>console.log(JSON.parse(s).version))')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Stage is live: \`$version\`" >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.STAGE_CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.STAGE_CLOUDFLARE_ACCOUNT_ID || vars.STAGE_CLOUDFLARE_ACCOUNT_ID }}
          DAIDAL_CHANNEL: stage
          DAIDAL_BRANCH: ${{ steps.line.outputs.branch }}
          DAIDAL_COMMIT: ${{ steps.line.outputs.sha }}
          DAIDAL_PR: ${{ steps.line.outputs.pr }}
      # By hand: set or clear the hold, once the deploy (if any) has gone through. A new hold replaces the old one;
      # a deploy without hold, or a release, clears it.
      - if: steps.line.outputs.manual == 'true'
        name: Record the hold
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          HOLD_ID: ${{ steps.line.outputs.hold_id }}
          SET_HOLD: ${{ !inputs.release && inputs.hold }}
          BRANCH: ${{ steps.line.outputs.branch }}
          SHA: ${{ steps.line.outputs.sha }}
          ACTOR: ${{ github.actor }}
        run: |
          if [ -n "$HOLD_ID" ]; then
            gh api "repos/$REPO/deployments/$HOLD_ID/statuses" -f state=inactive -f description="Released" > /dev/null
          fi
          if [ "$SET_HOLD" = "true" ]; then
            id="$(jq -n --arg ref "$SHA" --arg branch "$BRANCH" --arg by "$ACTOR" \
              '{ref: $ref, environment: "stage-hold", auto_merge: false, required_contexts: [], transient_environment: true,
                description: "Stage held by hand", payload: {branch: $branch, by: $by}}' \
              | gh api "repos/$REPO/deployments" --input - --jq .id)"
            gh api "repos/$REPO/deployments/$id/statuses" -f state=success -f description="Held on $BRANCH" \
              -f environment_url="https://daidal-stage.khorum.org" > /dev/null
            echo "::notice title=Stage held::Stage stays on $BRANCH until a code owner runs this workflow with release ticked."
          fi
      # One comment per PR, kept up to date: live on stage, or why not.
      - if: steps.setup.outputs.ready == 'true' && (steps.line.outputs.deploy == 'true' || github.event_name == 'pull_request')
        name: Say on the PR where stage stands
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEPLOYED: ${{ steps.line.outputs.deploy }}
          LIVE_PR: ${{ steps.line.outputs.pr }}
          LIVE_SHA: ${{ steps.line.outputs.sha }}
          LIVE_BRANCH: ${{ steps.line.outputs.branch }}
          LIVE_VERSION: ${{ steps.stage_deploy.outputs.version }}
          HELD: ${{ steps.line.outputs.held }}
          NOT_OWNER: ${{ steps.line.outputs.not_owner }}
          MANUAL: ${{ steps.line.outputs.manual }}
          RELEASE: ${{ steps.line.outputs.release }}
          HOLD: ${{ inputs.hold }}
          THIS_PR: ${{ github.event.pull_request.number }}
        run: |
          marker='<!-- skope-stage -->'
          live="https://daidal-stage.khorum.org (the app, with the stage data: https://daidal-stage.khorum.org/app/)"
          if [ "$DEPLOYED" = "true" ]; then
            # A branch put on stage by hand that has no open PR: nothing to tell.
            [ -n "$LIVE_PR" ] || exit 0
            target="$LIVE_PR"
            if [ "$MANUAL" = "true" ] && [ "$RELEASE" != "true" ]; then
              if [ "$HOLD" = "true" ]; then
                tail="Stage is **held** here by hand: PR pushes leave it alone for up to 12 hours, until this branch merges, or until a code owner releases it (Actions → deploy → Run workflow, tick release)."
              else
                tail="Put here by hand. The next push to any PR takes stage."
              fi
            else
              tail="Stage shows the last PR pushed: a push to another PR takes it, and the next push here brings it back. Stage data is invented and **resets on every deploy**, so nothing entered there is kept."
            fi
            body="$marker
          **Stage:** \`$LIVE_BRANCH\` at \`${LIVE_SHA:0:7}\` is live at $live
          ${LIVE_VERSION:+
          The account menu shows version \`$LIVE_VERSION\`.}

          $tail"
          else
            target="$THIS_PR"
            if [ -n "$HELD" ]; then
              body="$marker
          **Stage:** not deployed: stage is held by hand on \`$HELD\`. The hold ends after 12 hours, when that branch merges, or when a code owner releases it (Actions → deploy → Run workflow, tick release); the next push here then deploys."
            elif [ "$NOT_OWNER" = "true" ]; then
              body="$marker
          **Stage:** not deployed: only PRs opened by a code owner (.github/CODEOWNERS) deploy to stage by themselves. A code owner can put this branch there by hand (Actions → deploy → Run workflow)."
            fi
          fi
          id="$(gh api --paginate "repos/$REPO/issues/$target/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api "repos/$REPO/issues/$target/comments" -f body="$body" > /dev/null
          fi
